<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="content.js"></script>
  <style>
    .project-single {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .project-single .project-img {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--thumb-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      overflow: hidden;
    }

    .project-single .project-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
    }

    .project-single h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 400;
    }

    .project-single .project-desc {
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.75;
    }

    /* Code block */
    .code-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .code-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .code-wrapper {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #d0ccc8;
    }

    .code-copy-btn {
      position: absolute;
      top: 0.7rem;
      right: 0.8rem;
      background: #333;
      color: #eee;
      border: none;
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s;
    }

    .code-copy-btn:hover { background: #555; }
    .code-copy-btn.copied { background: #3a7d44; }

    pre {
      background: #1e1e2e;
      color: #cdd6f4;
      margin: 0;
      padding: 1.2rem 1.2rem 1.2rem 1.4rem;
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      line-height: 1.7;
    }

    /* simple syntax highlight colours */
    .kw  { color: #cba6f7; } /* keywords */
    .typ { color: #89b4fa; } /* types */
    .cm  { color: #6c7086; font-style: italic; } /* comments */
    .str { color: #a6e3a1; } /* strings */
    .num { color: #fab387; } /* numbers */
    .fn  { color: #89dceb; } /* function names */
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html" class="active">Portfolio</a></li>
      <li><a href="gameprojects.html">Game Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="card">

      <div class="page-header">
        <h1 id="page-heading"></h1>
        <p id="page-intro"></p>
      </div>

      <div class="project-single">

        <!-- PROJECT IMAGE -->
        <div class="project-img">🖼</div>

        <!-- PROJECT TITLE & DESCRIPTION -->
        <!-- ✏️ Edit title and description in content.js -->
        <div>
          <h2 id="proj-title"></h2>
          <p class="project-desc" id="proj-desc"></p>
        </div>

        <!-- C++ CODE BLOCK -->
        <!-- ✏️ Replace the code inside <pre> with your own C++ code -->
        <div class="code-section">
          <span class="code-label">C++ — Source Code</span>
          <div class="code-wrapper">
            <button class="code-copy-btn" onclick="copyCode(this)">Copy</button>
            <pre id="code-block"><span class="cm">// Paste your C++ code here</span>
<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>

<span class="kw">int</span> <span class="fn">main</span>() {
    std::cout <span class="str">&lt;&lt; "Hello, World!" &lt;&lt;</span> std::endl;
    <span class="kw">return</span> <span class="num">0</span>;
}</pre>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    const p = content.portfolio;
    document.getElementById('page-heading').textContent = p.heading;
    document.getElementById('page-intro').textContent   = p.intro;

    // Only show first project
    const proj = p.projects[0];
    document.getElementById('proj-title').textContent = proj.title;
    document.getElementById('proj-desc').textContent  = proj.description;

    function copyCode(btn) {
      const text = document.getElementById('code-block').innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      });
    }
  </script>

</body>
</html>
