  <main>
    <div class="card">

      <div class="page-header">
        <h1>Contact</h1>
        <p>Feel free to reach out — I am always happy to connect.</p>
      </div>

      <div class="contact-info">

        <!-- ✏️ Replace href and text with your actual email address -->
        <a href="mailto:your@email.com" class="contact-link">
          <div class="contact-icon">✉️</div>
          <div>
            <div class="contact-label">Email</div>
            <div class="contact-value">your@email.com</div>
          </div>
        </a>

        <!-- ✏️ Replace href and text with your actual LinkedIn URL -->
        <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="contact-link">
          <div class="contact-icon">💼</div>
          <div>
            <div class="contact-label">LinkedIn</div>
            <div class="contact-value">linkedin.com/in/yourprofile</div>
          </div>
        </a>

      </div>
    </div>
