<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Me & Contact</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="content.js"></script>
  <style>
    .about-section {
      padding-bottom: 2.5rem;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .about-section p {
      font-size: 0.93rem;
      line-height: 1.85;
      color: var(--text-main);
      margin-bottom: 1rem;
    }

    .about-section p:last-child { margin-bottom: 0; }

    .about-section p.notice {
      background: #f4f1ec;
      border-left: 3px solid #c9b99a;
      padding: 0.9rem 1.1rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* Outer wrapper — row with copy button on the right */
    .contact-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      transition: background-color 0.2s, border-color 0.2s;
      padding: 0;
      overflow: hidden;
    }

    .contact-link:hover {
      background: #f0ede8;
      border-color: #ccc;
    }

    /* The clickable link part */
    .contact-link-inner {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 1.2rem;
      text-decoration: none;
      color: var(--text-main);
      flex: 1;
      transition: transform 0.15s;
    }

    .contact-link:hover .contact-link-inner {
      transform: translateX(4px);
    }

    .copy-btn {
      background: none;
      border: none;
      border-left: 1px solid var(--border);
      padding: 0 1.2rem;
      height: 100%;
      min-height: 60px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #e8e4de; color: var(--text-main); }
    .copy-btn.copied { color: #3a7d44; }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html">Specialisation Project</a></li>
      <li><a href="gameprojects.html">Game Projects</a></li>
      <li><a href="contact.html" class="active">About Me &amp; Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="card">

      <!-- ABOUT ME -->
      <div class="about-section">
        <div class="page-header">
          <h1 id="about-heading"></h1>
        </div>
        <div id="about-text"></div>
      </div>

      <!-- CONTACT -->
      <div>
        <div class="page-header">
          <h1 id="contact-heading"></h1>
        </div>

        <div class="contact-info">

<!-- ✏️ Replace with your actual email address in both places -->
          <div class="contact-link">
            <a href="mailto:emma.stokki@gmail.com" class="contact-link-inner">
              <div class="contact-icon">&#x2709;&#xFE0F;</div>
              <div>
                <div class="contact-label">Email</div>
                <div class="contact-value">emma.stokki@gmail.com</div>
              </div>
            </a>
            <button class="copy-btn" onclick="copyText('emma.stokki@gmail.com', this)">Copy</button>
          </div>

          <!-- ✏️ Replace with your actual LinkedIn URL in both places -->
          <div class="contact-link">
            <a href="https://www.linkedin.com/in/emma-stokki-6b91573b6" target="_blank" class="contact-link-inner">
              <div class="contact-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="#0A66C2">
                  <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.43v6.31zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45C23.21 24 24 23.23 24 22.28V1.72C24 .77 23.21 0 22.22 0z"/>
                </svg>
              </div>
              <div>
                <div class="contact-label">LinkedIn</div>
                <div class="contact-value">linkedin.com/in/emma-stokki-6b91573b6</div>
              </div>
            </a>
            <button class="copy-btn" onclick="copyText('linkedin.com/in/emma-stokki-6b91573b6', this)">Copy</button>
          </div>

          <!-- ✏️ Put your PDF in your portfolio folder and update the filename below -->
          <div class="contact-link">
            <a href="resume.pdf" download class="contact-link-inner">
              <div class="contact-icon">&#x1F4C4;</div>
              <div>
                <div class="contact-label">Resume</div>
                <div class="contact-value">Download PDF</div>
              </div>
            </a>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script>
    var c = content.contact;
    document.getElementById('about-heading').textContent   = c.aboutHeading;
    document.getElementById('contact-heading').textContent = c.contactHeading;

    var aboutDiv = document.getElementById('about-text');
    c.aboutParagraphs.forEach(function(text, i) {
      var p = document.createElement('p');
      if (i === c.aboutParagraphs.length - 1) p.className = 'notice';
      p.innerHTML = text.replace(/\n/g, '<br>');
      aboutDiv.appendChild(p);
    });

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(function() {
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }
  </script>

</body>
</html>
