<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Projects</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="content.js"></script>
  <style>

    /* ── 3×2 grid at the top ── */
    .game-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .game-card {
      background: #f7f5f2;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }

    .game-card-media {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--thumb-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }

    .game-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: background 0.2s;
    }

    .game-card:hover .play-btn { background: rgba(0,0,0,0.75); }

    .play-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
      margin-left: 2px;
    }

    .game-card-info {
      padding: 0.65rem 0.85rem 0.75rem;
    }

    .game-card-info h3 {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 0.15rem;
    }

    .game-card-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ── divider between grid and full sections ── */
    .sections-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    /* ── full project sections ── */
    .game-section {
      padding-bottom: 3rem;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 80px; /* offset for sticky nav */
    }

    .game-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .game-section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .game-section .section-desc {
      font-size: 0.93rem;
      color: var(--text-muted);
      line-height: 1.75;
      margin-bottom: 1.5rem;
    }

    /* media area inside full section */
    .game-section-media {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--thumb-bg);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      position: relative;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .game-section-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-section-media .play-btn {
      width: 56px;
      height: 56px;
    }

    .game-section-media .play-btn svg {
      width: 22px;
      height: 22px;
    }

    .game-section:hover .game-section-media .play-btn {
      background: rgba(0,0,0,0.75);
    }

    /* ── video modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #1e1e1e;
      border-radius: 14px;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      position: relative;
    }

    .modal-box video {
      width: 100%;
      display: block;
      max-height: 80vh;
    }

    .modal-close {
      position: absolute;
      top: 0.7rem;
      right: 0.9rem;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.15s;
    }

    .modal-close:hover { background: rgba(0,0,0,0.85); }

    .back-to-top {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      transition: background-color 0.15s, color 0.15s;
    }

    .back-to-top:hover {
      background: #f0ede8;
      color: var(--text-main);
    }

    /* Read more toggle */
    .read-more-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1rem;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.9rem;
      transition: background-color 0.15s, color 0.15s;
      user-select: none;
    }

    .read-more-toggle:hover {
      background: #f0ede8;
      color: var(--text-main);
    }

    .read-more-toggle svg {
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .read-more-content {
      display: none;
      margin-top: 1.2rem;
    }

    .read-more-content.open {
      display: block;
    }

    .read-more-content p {
      font-size: 0.93rem;
      line-height: 1.8;
      color: var(--text-main);
      margin-bottom: 0.8rem;
    }

    @media (max-width: 520px) {
      .game-grid { grid-template-columns: 1fr 1fr; }
    }

    .video-placeholder {
      width: 75%; /* ← change this to resize. 100% = edge to edge, 75% = 25% smaller */
      margin: 0 auto 1.5rem; /* keeps it centred */
      aspect-ratio: 16/9;
      background: #e8e4de;
      border-radius: 12px;
      border: 2px dashed #c8c4be;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-placeholder-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      color: #aaa;
    }

    .video-placeholder-inner svg {
      width: 48px;
      height: 48px;
    }

    .video-placeholder-inner span {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="portfolio.html">Specialisation Project</a></li>
      <li><a href="gameprojects.html" class="active">Game Projects</a></li>
      <li><a href="contact.html">About Me &amp; Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="card">

      <div class="page-header">
        <h1 id="page-heading"></h1>
        <p id="page-intro"></p>
      </div>

      <!-- 3×2 grid — links scroll down to each section -->
      <div class="game-grid" id="game-grid"></div>

      <hr class="sections-divider"/>

      <!-- Full project sections -->
      <div id="game-sections"></div>

    </div>
  </main>

  <script>
    const g = content.gameprojects;
    document.getElementById('page-heading').textContent = g.heading;
    document.getElementById('page-intro').textContent   = g.intro;

    const grid     = document.getElementById('game-grid');
    const sections = document.getElementById('game-sections');

    // Reverse so latest is first
    const projects = [...g.projects].reverse();

    projects.forEach((proj, i) => {
      const id = 'game-' + i;
      const hasImage   = proj.image && proj.image.length > 0;
      const hasVideo   = proj.video && proj.video.length > 0;
      const hasDetails = proj.details && proj.details.trim().length > 0;
      const hasExtraImages = proj.images && proj.images.length > 0;

      const thumbMedia = hasImage
        ? `<img src="${proj.image}" alt="${proj.title}" onerror="this.style.display='none'"/>`
        : `<span>${proj.emoji}</span>`;

      // ── Grid card ──
      grid.innerHTML += `
        <a href="#${id}" class="game-card">
          <div class="game-card-media">${thumbMedia}</div>
          <div class="game-card-info">
            <h3>${proj.title}</h3>
            <p>${proj.description}</p>
          </div>
        </a>`;

      // ── Video or placeholder ──
      const sectionMedia = hasVideo
        ? `<video controls style="width:75%;border-radius:12px;display:block;margin:0 auto 1.5rem;" poster="${proj.image || ''}">
             <source src="${proj.video}">
           </video>`
        : `<div class="video-placeholder">
             <div class="video-placeholder-inner">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                 <rect x="2" y="4" width="20" height="16" rx="3"/>
                 <polygon points="9,8 17,12 9,16" fill="currentColor" stroke="none"/>
               </svg>
               <span>Video coming soon</span>
             </div>
           </div>`;

      // ── Extra images ──
      let extraImagesHTML = '';
      if (hasExtraImages) {
        const imgs = proj.images.map(src =>
          `<img src="${src}" style="width:100%;border-radius:10px;display:block;" onerror="this.style.display='none'"/>`
        ).join('');
        extraImagesHTML = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-top:1rem;">${imgs}</div>`;
      }

      // ── Read more block ──
      const readMoreHTML = (hasDetails || hasExtraImages) ? `
        <div class="read-more-toggle" onclick="toggleDetails('details-${id}', this)">
          <span>Read more</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="6,9 12,15 18,9"/></svg>
        </div>
        <div class="read-more-content" id="details-${id}">
          ${hasDetails ? `<p>${proj.details.replace(/\n/g, '<br>')}</p>` : ''}
          ${extraImagesHTML}
        </div>` : '';

      sections.innerHTML += `
        <div class="game-section" id="${id}">
          <h2>${proj.title}</h2>
          ${sectionMedia}
          <p class="section-desc">${(proj.text || proj.description || '').replace(/\n/g, '<br>')}</p>
          ${readMoreHTML}
          <a href="#game-grid" class="back-to-top">↑ Back to top</a>
        </div>`;
    });

    function toggleDetails(id, btn) {
      const el = document.getElementById(id);
      const isOpen = el.classList.toggle('open');
      btn.querySelector('span').textContent = isOpen ? 'Read less' : 'Read more';
      btn.querySelector('svg').style.transform = isOpen ? 'rotate(180deg)' : '';
    }
  </script>

</body>
</html>
